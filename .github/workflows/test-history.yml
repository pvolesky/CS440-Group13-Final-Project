
name: Test History Metrics

on:
  push:
    branches:
      - feature/churn-age-metrics
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: python -m pip install matplotlib

      - name: Run automated tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Generate history metrics
        run: |
          python scripts/history_metrics.py . \
            --snapshot-date 2026-11-15T23:59:59Z \
            --window-days 365 \
            --output results.csv

      - name: Display results
        run: cat results.csv

      - name: Upload CSV results
        uses: actions/upload-artifact@v4
        with:
          name: history-metrics-results
          path: results.csv
